<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWL Forms - Test Form</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .form-wrapper { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 40px; }
        .form-header { margin-bottom: 32px; text-align: center; }
        .form-header h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 8px; }
        .form-header p { color: #666; font-size: 14px; }
        .field-group { margin-bottom: 20px; }
        .field-group label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
        .field-group input, .field-group select, .field-group textarea {
            width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 15px; transition: border-color 0.2s;
        }
        .field-group input:focus, .field-group select:focus, .field-group textarea:focus {
            outline: none; border-color: #1976d2; box-shadow: 0 0 0 3px rgba(25,118,210,0.1);
        }
        .field-group input[readonly] { background: #f9f9f9; color: #666; }
        .btn-submit {
            width: 100%; padding: 14px; background: #1976d2; color: #fff; border: none;
            border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;
            transition: background 0.2s; margin-top: 12px;
        }
        .btn-submit:hover { background: #1565c0; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
        .btn-draft {
            width: 100%; padding: 12px; background: transparent; color: #1976d2; border: 1px solid #1976d2;
            border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 10px;
        }
        .btn-draft:hover { background: #f0f7ff; }
        .row { display: flex; gap: 16px; }
        .row .field-group { flex: 1; }
        .powered-by { text-align: center; margin-top: 20px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="form-wrapper" id="owl-form-container">
        <div class="form-card">
            <div class="form-header">
                <h1>Sample OWL Form</h1>
                <p>This is a test form demonstrating the OWL SDK integration</p>
            </div>

            <form id="owlTestForm" onsubmit="handleSubmit(event)">
                <!-- Pre-filled fields (read-only, from Salesforce) -->
                <div class="row">
                    <div class="field-group">
                        <label>Account Name</label>
                        <input type="text" data-owl-field="accountName" readonly>
                    </div>
                    <div class="field-group">
                        <label>Account Number</label>
                        <input type="text" data-owl-field="accountNumber" readonly>
                    </div>
                </div>

                <div class="row">
                    <div class="field-group">
                        <label>Contact Name</label>
                        <input type="text" data-owl-field="contactName" readonly>
                    </div>
                    <div class="field-group">
                        <label>Email</label>
                        <input type="email" data-owl-field="contactEmail" readonly>
                    </div>
                </div>

                <hr style="border:none;border-top:1px solid #eee;margin:24px 0;">

                <!-- Editable fields (customer fills in) -->
                <div class="field-group">
                    <label>PO Number *</label>
                    <input type="text" data-owl-field="poNumber" required placeholder="Enter your PO number">
                </div>

                <div class="row">
                    <div class="field-group">
                        <label>PO Amount</label>
                        <input type="number" data-owl-field="poAmount" step="0.01" placeholder="0.00">
                    </div>
                    <div class="field-group">
                        <label>PO Date</label>
                        <input type="date" data-owl-field="poDate">
                    </div>
                </div>

                <div class="field-group">
                    <label>Notes</label>
                    <textarea data-owl-field="notes" rows="3" placeholder="Any additional notes..."></textarea>
                </div>

                <!-- Conditional section example -->
                <div data-owl-condition="showUrgent" style="display:none;">
                    <div class="field-group">
                        <label>Urgency Reason</label>
                        <input type="text" data-owl-field="urgencyReason" placeholder="Why is this urgent?">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Submit Form</button>
                <button type="button" class="btn-draft" id="draftBtn" onclick="handleDraft()">Save as Draft</button>
            </form>
        </div>
        <p class="powered-by">Powered by OWL Forms Platform</p>
    </div>

    <script src="owl-sdk.js"></script>
    <script>
        async function initForm() {
            const token = OwlForms.getToken();
            if (!token) {
                document.getElementById('owl-form-container').innerHTML = `
                    <div style="text-align:center;padding:60px;font-family:sans-serif;">
                        <h2 style="color:#f44336;">Missing Token</h2>
                        <p style="color:#666;margin-top:12px;">This form requires a valid token. Please use the link provided to you.</p>
                    </div>`;
                return;
            }

            const success = await OwlForms.init({
                baseUrl: 'https://wluk--ashkay.sandbox.my.salesforce-sites.com',
                token: token,
                autoSaveDraft: true,
                autoSaveInterval: 60000,
                debug: true,
                onLoad: function(result) {
                    console.log('Form loaded successfully:', result);
                },
                onSubmitSuccess: function(result) {
                    console.log('Submission successful:', result);
                },
                onSubmitError: function(err) {
                    console.error('Submission failed:', err);
                },
                onDraftSaved: function(result) {
                    console.log('Draft saved:', result);
                }
            });
        }

        async function handleSubmit(event) {
            event.preventDefault();
            document.getElementById('submitBtn').disabled = true;
            try {
                await OwlForms.submit();
            } catch (err) {
                console.error(err);
            }
            document.getElementById('submitBtn').disabled = false;
        }

        async function handleDraft() {
            await OwlForms.saveDraft();
        }

        document.addEventListener('DOMContentLoaded', initForm);
    </script>
</body>
</html>
